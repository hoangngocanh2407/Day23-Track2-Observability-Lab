global:
  resolve_timeout: 1m

route:
  receiver: 'slack'
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: 'slack'
    slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL'
        channel: '#observability'
        send_resolved: true
        text: |
          {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
